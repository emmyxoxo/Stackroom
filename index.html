<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackroom — Student E-Library</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">S</div> Stackroom</div>
    <div id="who-box"></div>
  </div>

  <!-- AUTH -->
  <div class="view active" id="view-auth">
    <div class="auth-box card">
      <div id="auth-tabs" class="row" style="margin-bottom:14px;">
        <button class="btn btn-sm" id="tab-login" onclick="showAuthMode('login')">Log in</button>
        <button class="btn btn-sm" id="tab-register" onclick="showAuthMode('register')">Register</button>
      </div>
      <form id="login-form" onsubmit="doLogin(event)">
        <label>Username</label><input id="login-username" required>
        <label>Password</label><input id="login-password" type="password" required>
        <button class="btn btn-solid" style="margin-top:14px;width:100%;">Log in</button>
      </form>
      <form id="register-form" style="display:none;" onsubmit="doRegister(event)">
        <label>Username</label><input id="reg-username" required>
        <label>Password</label><input id="reg-password" type="password" required>
        <label>I am a</label>
        <select id="reg-role"><option value="student">Student</option><option value="teacher">Teacher</option></select>
        <label>Campus</label><input id="reg-campus">
        <label>College</label><input id="reg-college">
        <button class="btn btn-solid" style="margin-top:14px;width:100%;">Create account</button>
        <p class="muted" style="margin-top:8px;">New accounts need admin approval before you can log in.</p>
      </form>
      <p id="auth-msg" class="muted"></p>
    </div>
  </div>

  <!-- APP -->
  <div class="view" id="view-app">
    <nav class="tabs" id="main-tabs"></nav>

    <div class="view active" id="tab-browse">
      <div class="row" style="margin-bottom:12px;">
        <input id="search-input" placeholder="Search books by title or author..." oninput="loadBooks()" style="max-width:340px;">
      </div>
      <div id="books-list"></div>
    </div>

    <div class="view" id="tab-upload">
      <h3>Upload a PDF</h3>
      <form onsubmit="doUpload(event)">
        <label>Title</label><input id="up-title" required>
        <div class="grid2"><div><label>Author</label><input id="up-author"></div><div><label>Description</label><input id="up-desc"></div></div>
        <div class="grid2"><div><label>Campus</label><input id="up-campus"></div><div><label>College</label><input id="up-college"></div></div>
        <label>PDF file</label><input id="up-file" type="file" accept="application/pdf" required>
        <button class="btn btn-solid" style="margin-top:14px;">Upload</button>
      </form>
      <p id="up-msg" class="muted"></p>
    </div>

    <div class="view" id="tab-requests">
      <h3>Book requests</h3>
      <form onsubmit="doCreateRequest(event)" class="card">
        <label>Title</label><input id="req-title" required>
        <label>Author</label><input id="req-author">
        <label>Note</label><input id="req-note">
        <button class="btn btn-solid" style="margin-top:10px;">Request book</button>
      </form>
      <div id="requests-list"></div>
    </div>

    <div class="view" id="tab-bookmarks"><h3>My bookmarks</h3><div id="bookmarks-list"></div></div>

    <div class="view" id="tab-summaries">
      <h3>Summarize a PDF</h3>
      <input id="sum-file" type="file" accept="application/pdf">
      <button class="btn btn-solid btn-sm" style="margin-top:8px;" onclick="doSummarize()">Generate summary</button>
      <div id="sum-result" class="card" style="display:none;margin-top:14px;"></div>
      <h4 style="margin-top:24px;">Saved summaries</h4>
      <div id="summaries-list"></div>
    </div>

    <div class="view" id="tab-quizzes">
      <h3>Quiz yourself on a PDF</h3>
      <input id="quiz-file" type="file" accept="application/pdf">
      <button class="btn btn-solid btn-sm" style="margin-top:8px;" onclick="doQuiz()">Generate quiz</button>
      <div id="quiz-result" class="card" style="display:none;margin-top:14px;"></div>
      <h4 style="margin-top:24px;">Saved quizzes</h4>
      <div id="quizzes-list"></div>
    </div>

    <div class="view" id="tab-admin">
      <h3>Pending approvals</h3><div id="admin-pending"></div>
      <h3 style="margin-top:24px;">All users</h3><div id="admin-users"></div>
      <h3 style="margin-top:24px;">Audit log</h3><div id="admin-audit"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
